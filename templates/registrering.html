<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Registrering</title>
</head>
<body>
    <h1>Registreringsskjema</h1>

    <form method="POST">
        <label>Navn:</label>
        <input type="text" name="navn" required>

        <br><br>

        <label>E-post:</label>
        <input type="email" name="epost" required>

        <br><br>

        <label>Alder:</label>
        <input type="number" name="alder" required>

        <br><br>

        <label>Kommentar:</label>
        <textarea name="kommentar"></textarea>

        <br><br>

        <button type="submit">Registrer</button>
    </form>
</body>
</html>
