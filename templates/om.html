<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>{{ navn }}</h1>
    <p>Jeg er {{ alder }} gammel</p>
    <p>Er elsker {{ språk }}</p>
    <p>{{ skole }}</p>

    {% if alder >= 18 %}
        <p>Du er myndig</p>
    {% else %}
        <p>Du er under 18 år.</p>
    {% endif %}


</body>
</html>
